<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarimo Talent - Sales Intelligence</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#172033}
.app{max-width:900px;margin:30px auto;padding:24px}
h1{margin-bottom:5px}.subtitle{color:#667085;margin-top:0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:25px}
.card{background:white;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.label{color:#667085;font-size:14px}.value{font-size:28px;font-weight:bold;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<h1>Clarimo Talent</h1>
<p class="subtitle">Sales Intelligence Dashboard</p>
<div class="cards">
<div class="card"><div class="label">Revenue</div><div class="value">₹25 Cr</div></div>
<div class="card"><div class="label">Margin</div><div class="value">18%</div></div>
<div class="card"><div class="label">Open Opportunities</div><div class="value">42</div></div>
</div>
</div>
</body>
</html>
